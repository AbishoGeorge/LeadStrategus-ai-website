<figure class="sys" aria-label="The 8-step outbound GTM execution system">
      <div class="sys-head">
        <p class="sys-kicker">The system</p>
        <h3 class="sys-title">The 8-step outbound GTM execution system</h3>
        <p class="sys-sub">An intelligence-led process from client understanding to meetings: the right accounts, the right people and the right conversations.</p>
      </div>
      <div class="sys-board">
        <div class="sys-phase p1" style="--span:3"><span class="ph-n">Phase 1</span><span class="ph-name">Understand and define the market</span><span class="ph-sub">Build the foundation <em>· Steps 01 to 03</em></span></div><div class="sys-phase p2" style="--span:2"><span class="ph-n">Phase 2</span><span class="ph-name">Build intelligence and the prospect database</span><span class="ph-sub">Find the right accounts and people <em>· Steps 04 to 05</em></span></div><div class="sys-phase p3" style="--span:3"><span class="ph-n">Phase 3</span><span class="ph-name">Design the conversation and drive outcomes</span><span class="ph-sub">Create, launch and improve campaigns <em>· Steps 06 to 08</em></span></div>

          <div class="sc-why"><span class="sc-lbl">Objective</span><p>Understand what the client sells, who buys, why they buy and what success looks like.</p></div>
          <button type="button" class="sc-toggle" aria-expanded="false">Key activities and output <svg class="ic sc-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6" /></svg></button>
          <div class="sc-how"><span class="sc-lbl">Key activities</span><ul><li>Discovery interviews</li><li>Structured questionnaire</li><li>Study existing customers</li><li>Pain points and differentiators</li></ul></div>
          <div class="sc-out"><svg class="ic so-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></svg><div><span class="sc-lbl">Output</span><p>Client brief, pain-point map, targeting hypothesis</p></div></div>

          <div class="sc-how"><span class="sc-lbl">Key activities</span><ul><li>Define the ideal customer profile</li><li>Segment by industry</li><li>Set geographies and company size</li><li>Inclusion and exclusion rules</li></ul></div>

          <div class="sc-how"><span class="sc-lbl">Key activities</span><ul><li>Apply ICP filters</li><li>Consolidate several sources</li><li>Standardise and de-duplicate</li><li>Remove obvious exclusions</li></ul></div>

          <div class="sc-how"><span class="sc-lbl">Key activities</span><ul><li>Find signals: hiring, expansion, initiatives</li><li>Enrich company data</li><li>Create micro-segments</li><li>Score and rank accounts</li></ul></div>
