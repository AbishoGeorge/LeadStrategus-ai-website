<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(../public/fonts/montserrat.woff2);font-weight:100 900}
@font-face{font-family:C;src:url(../public/fonts/cinzel-700.woff2);font-weight:700}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:M,sans-serif;color:#0B2A6B;background:#fff;position:relative;display:flex;align-items:center;padding:0 80px;gap:72px}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 380px at 0% 0%,rgba(0,102,255,.07),transparent),radial-gradient(560px 420px at 100% 100%,rgba(225,6,0,.06),transparent)}
body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#E10600,#0066FF)}
.logo{position:relative;flex:none;text-align:center}
.logo img{height:300px;display:block;margin:0 auto}
.word{margin-top:22px;font:700 34px C,serif;letter-spacing:.06em;color:#0B2A6B}
.copy{position:relative}
.eb{font-weight:700;font-size:20px;letter-spacing:.16em;color:#B10000}
h1{margin-top:18px;font-size:72px;line-height:1.02;font-weight:800;letter-spacing:-.03em}
.bar{width:80px;height:6px;border-radius:6px;background:#E10600;margin:28px 0}
.meta{font-size:30px;font-weight:600;color:#3F3D56}
.meta b{color:#E10600;font-weight:800}
</style></head><body>
<div class="logo"><img src="../public/brand/leadstrategus-shield.png" alt=""><p class="word">LEADSTRATEGUS</p></div>
<div class="copy">
  <p class="eb">5 DAYS + 4 WEEKS · IN PERSON</p>
  <h1>GTM Engineering Workshop</h1>
  <div class="bar"></div>
  <p class="meta">Bengaluru · Cohort 1 · <b>12 seats</b></p>
</div>
</body></html>
